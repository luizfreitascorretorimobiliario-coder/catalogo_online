<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Império Imobiliária | Catálogo Digital</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:wght@700&display=swap');
        :root { --gold: #c5a059; --black: #000000; --dark-gray: #0a0a0a; --white: #ffffff; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--black); color: var(--white); margin: 0; padding: 0; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; background: var(--black); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .admin-controls { display: none; }
        .is-admin .admin-controls { display: flex; gap: 10px; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background: #0d0d0d; padding: 40px; border: 1px solid var(--gold); width: 90%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 15px; margin: 10px 0; background: #000; border: 1px solid #333; color: white; box-sizing: border-box; }
        .btn-gold { width: 100%; padding: 15px; background: var(--gold); border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        #lista-imoveis { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 25px; max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .card { background: var(--dark-gray); border: 1px solid #1a1a1a; position: relative; }
        .card img { width: 100%; height: 300px; object-fit: cover; }
    </style>
</head>
<body id="main-body">

<header>
    <div style="font-weight:bold; color:var(--gold)">IMPÉRIO</div>
    <div>
        <button class="btn-header" onclick="abrirModal('modal-add')">Adicionar Imóvel</button>
        <button class="btn-header" onclick="abrirModal('modal-login')">Painel ADM</button>
    </div>
</header>

<div id="lista-imoveis"></div>

<div id="modal-login" class="modal">
    <div class="modal-content">
        <input type="password" id="senhaAdmin" placeholder="Senha">
        <button class="btn-gold" onclick="verificarSenha()">Entrar</button>
    </div>
</div>

<div id="modal-add" class="modal">
    <div class="modal-content">
        <input type="text" id="cidade" placeholder="Nome do Empreendimento">
        <input type="number" id="quartos" placeholder="Suítes">
        <button class="btn-gold" onclick="salvarImovel()">Salvar no Banco</button>
    </div>
</div>

<script>
    // INTEGRAÇÃO SUPABASE
    const supabaseUrl = 'https://ohjtosiyfwxzkgeewizv.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oanRvc2l5Znd4emtnZWV3aXp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2MjA4MzcsImV4cCI6MjA5MjE5NjgzN30.4d_NcCXDUMq9JdAETvssI8bv5WY3c5F4hzEVnL9XjdY';
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    function verificarSenha() {
        if(document.getElementById('senhaAdmin').value === '123') {
            document.getElementById('main-body').classList.add('is-admin');
            alert("Administrador autenticado!");
            fecharModal('modal-login');
        } else { alert("Senha incorreta!"); }
    }

    async function carregarImoveis() {
        const { data, error } = await supabase.from('imoveis').select('*');
        if (data) {
            const grid = document.getElementById('lista-imoveis');
            grid.innerHTML = data.map(im => `
                <div class="card">
                    <img src="https://via.placeholder.com/400" alt="Imóvel">
                    <div style="padding:15px;">
                        <h3>${im.cidade}</h3>
                        <p>${im.quartos} Suítes</p>
                        <div class="admin-controls">
                            <button class="btn-gold" onclick="excluir('${im.id}')">Excluir</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }
    }

    async function salvarImovel() {
        const { data, error } = await supabase.from('imoveis').insert([{
            cidade: document.getElementById('cidade').value,
            quartos: document.getElementById('quartos').value
        }]);
        if (!error) {
            alert("Imóvel adicionado!");
            carregarImoveis();
            fecharModal('modal-add');
        } else {
            console.error(error);
            alert("Erro ao salvar! Verifique as políticas RLS no Supabase.");
        }
    }

    async function excluir(id) {
        await supabase.from('imoveis').delete().eq('id', id);
        carregarImoveis();
    }

    function abrirModal(id) { document.getElementById(id).style.display = 'flex'; }
    function fecharModal(id) { document.getElementById(id).style.display = 'none'; }

    carregarImoveis();
</script>
</body>
</html>
