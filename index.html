<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Império Imobiliária | Catálogo Digital</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:wght@700&display=swap');
        :root { --gold: #c5a059; --black: #000000; --dark-gray: #0a0a0a; --white: #ffffff; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--black); color: var(--white); margin: 0; padding: 0; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; background: var(--black); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .header-logo { height: 65px; }
        .header-right { display: flex; align-items: center; gap: 25px; }
        .btn-header { color: var(--white); text-decoration: none; font-size: 11px; font-weight: bold; background: none; border: none; cursor: pointer; text-transform: uppercase; }
        #btn-add { display: none; } /* Escondido por padrão */
        .is-admin #btn-add { display: block; } 
        #lista-imoveis { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 25px; max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .card { background: var(--dark-gray); border: 1px solid #1a1a1a; position: relative; }
        .media-container { width: 100%; height: 300px; background: #222; display: flex; align-items: center; justify-content: center; }
        .card-info { padding: 20px; }
        .btn-media { background: var(--gold); border: none; padding: 5px 10px; margin: 5px; cursor: pointer; font-size: 10px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: #0d0d0d; padding: 30px; border: 1px solid var(--gold); width: 90%; max-width: 400px; }
        input { width: 100%; padding: 10px; margin: 5px 0; background: #000; border: 1px solid #333; color: white; box-sizing: border-box; }
        .btn-gold { width: 100%; padding: 15px; background: var(--gold); border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body id="main-body">

<header>
    <img src="logo.png" class="header-logo" alt="Império">
    <div class="header-right">
        <button id="btn-add" class="btn-header" onclick="abrirModal('modal-add')">Adicionar Imóvel</button>
        <button class="btn-header" onclick="abrirModal('modal-login')">Painel ADM</button>
    </div>
</header>

<div id="lista-imoveis"></div>

<div id="modal-login" class="modal">
    <div class="modal-content">
        <h2>ACESSO</h2>
        <input type="password" id="senhaAdmin" placeholder="Senha">
        <button class="btn-gold" onclick="verificarSenha()">Entrar</button>
    </div>
</div>

<div id="modal-add" class="modal">
    <div class="modal-content">
        <h2>NOVO IMÓVEL</h2>
        <input type="text" id="cidade" placeholder="Empreendimento">
        <input type="number" id="quartos" placeholder="Suítes">
        <input type="number" id="unidades" placeholder="Vagas">
        <input type="text" id="fotoUrl" placeholder="URL da Foto">
        <input type="text" id="videoUrl" placeholder="URL do Vídeo">
        <button class="btn-gold" onclick="salvarImovel()">Salvar</button>
    </div>
</div>

<script>
    const supabaseClient = supabase.createClient('https://ohjtosiyfwxzkgeewizv.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oanRvc2l5Znd4emtnZWV3aXp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2MjA4MzcsImV4cCI6MjA5MjE5NjgzN30.4d_NcCXDUMq9JdAETvssI8bv5WY3c5F4hzEVnL9XjdY');

    async function carregarImoveis() {
        const { data } = await supabaseClient.from('imoveis').select('*');
        const grid = document.getElementById('lista-imoveis');
        grid.innerHTML = (data || []).map(im => `
            <div class="card">
                <div class="media-container" id="media-${im.id}">
                    <img src="${im.fotoUrl}" style="width:100%; height:100%; object-fit:cover;">
                </div>
                <div class="card-info">
                    <h3>${im.cidade}</h3>
                    <p>${im.quartos} SUÍTES • ${im.unidades} VAGAS</p>
                    <button class="btn-media" onclick="mostrarFoto('${im.id}', '${im.fotoUrl}')">FOTO</button>
                    <button class="btn-media" onclick="mostrarVideo('${im.id}', '${im.videoUrl}')">VÍDEO</button>
                </div>
            </div>
        `).join('');
    }

    function mostrarFoto(id, url) { document.getElementById('media-'+id).innerHTML = `<img src="${url}" style="width:100%; height:100%; object-fit:cover;">`; }
    function mostrarVideo(id, url) { document.getElementById('media-'+id).innerHTML = `<iframe width="100%" height="100%" src="${url}" frameborder="0" allowfullscreen></iframe>`; }

    async function salvarImovel() {
        const dados = { 
            cidade: document.getElementById('cidade').value, 
            quartos: document.getElementById('quartos').value, 
            unidades: document.getElementById('unidades').value,
            fotoUrl: document.getElementById('fotoUrl').value,
            videoUrl: document.getElementById('videoUrl').value
        };
        await supabaseClient.from('imoveis').insert([dados]);
        carregarImoveis();
        fecharModal('modal-add');
    }

    function verificarSenha() {
        if(document.getElementById('senhaAdmin').value === '123') {
            document.getElementById('main-body').classList.add('is-admin');
            fecharModal('modal-login');
        } else { alert("Senha Incorreta!"); }
    }

    function abrirModal(id) { document.getElementById(id).style.display = 'flex'; }
    function fecharModal(id) { document.getElementById(id).style.display = 'none'; }

    carregarImoveis();
</script>
</body>
</html>
