<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Império Imobiliária | Catálogo Digital</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:wght@700&display=swap');
        :root {
            --gold: #c5a059;
            --black: #000000;
            --dark-gray: #0a0a0a;
            --white: #ffffff;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--black);
            color: var(--white);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: var(--black);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header-logo { height: 65px; }
        .header-right { display: flex; align-items: center; gap: 25px; }
        .btn-header {
            color: var(--white);
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 2px;
            font-weight: bold;
            background: none;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }
        .btn-header:hover { color: var(--gold); }
        .insta-icon { height: 24px; filter: invert(1); opacity: 0.8; transition: 0.3s; }
        .insta-icon:hover { opacity: 1; transform: scale(1.1); }
        .hero {
            text-align: center;
            padding: 50px 20px;
            background: var(--black);
        }
        .hero-logo-grande {
            max-width: 450px;
            margin-bottom: 10px;
        }
        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.8rem;
            color: var(--gold);
            margin: 0;
            font-weight: 700;
        }
        .hero p {
            letter-spacing: 5px;
            font-size: 14px;
            text-transform: uppercase;
            font-weight: 300;
            margin-top: 10px;
        }
        .gold-line {
            width: 120px;
            height: 1px;
            background: var(--gold);
            margin: 30px auto;
        }
        #lista-imoveis {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto 80px;
            padding: 0 20px;
        }
        .card {
            background: var(--dark-gray);
            border: 1px solid #1a1a1a;
            position: relative;
            overflow: hidden;
            transition: 0.4s;
        }
        .card:hover { border-color: var(--gold); }
        .card img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            cursor: pointer;
        }
        .card-info {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: linear-gradient(transparent, rgba(0,0,0,0.95));
            padding: 20px;
            box-sizing: border-box;
        }
        .card-info h3 { color: var(--gold); margin: 0; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; }
        .card-info p { margin: 5px 0 0; font-size: 0.8rem; color: #bbb; letter-spacing: 1px; }
        .admin-controls { display: none; position: absolute; top: 15px; width: 100%; padding: 0 15px; box-sizing: border-box; z-index: 10; }
        .is-admin .admin-controls { display: flex; justify-content: space-between; }
        .btn-tool { width: 35px; height: 35px; border-radius: 50%; border: none; cursor: pointer; background: rgba(0,0,0,0.8); color: white; border: 1px solid var(--gold); }
        footer {
            text-align: center;
            padding: 80px 20px;
            border-top: 1px solid rgba(197, 160, 89, 0.2);
            background: var(--black);
        }
        .footer-logo { height: 50px; margin-bottom: 20px; }
        .footer-name {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--gold);
            margin: 0;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .footer-info {
            margin-top: 20px;
            font-size: 11px;
            letter-spacing: 4px;
            color: #777;
            text-transform: uppercase;
            line-height: 2;
        }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: #0d0d0d; padding: 40px; border: 1px solid var(--gold); width: 90%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 15px; margin: 10px 0; background: #000; border: 1px solid #333; color: white; box-sizing: border-box; }
        .btn-gold { width: 100%; padding: 15px; background: var(--gold); border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
    </style>
</head>
<body id="main-body">
<header>
    <img src="logo.png" class="header-logo" alt="Império">
    <div class="header-right">
        <button class="btn-header" onclick="abrirModal('modal-add')">Adicionar Imóvel</button>
        <button class="btn-header" onclick="abrirModal('modal-login')">Painel ADM</button>
        <a href="https://www.instagram.com/imperio_imobiliaria1/" target="_blank">
            <img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" class="insta-icon" alt="Instagram">
        </a>
    </div>
</header>

<section class="hero">
    <img src="logo.png" class="hero-logo-grande" alt="Império Imobiliária">
    <h1>Catálogo Digital</h1>
    <p>Império Imobiliária | Acredite e Realize!</p>
    <div class="gold-line"></div>
</section>

<div id="lista-imoveis"></div>

<footer>
    <img src="logo.png" class="footer-logo" alt="Império">
    <h2 class="footer-name">Império</h2>
    <div class="footer-info">
        EXCELÊNCIA EM NEGÓCIOS IMOBILIÁRIOS | CRECI 20199-J | PERNAMBUCO
    </div>
</footer>

<!-- Modal Login -->
<div id="modal-login" class="modal">
    <div class="modal-content">
        <h2 style="color:var(--gold)">ACESSO ADM</h2>
        <input type="email" id="emailAdmin" placeholder="E-mail" value="luizfreitascorretorimobiliario@gmail.com">
        <input type="password" id="senhaAdmin" placeholder="Senha">
        <button class="btn-gold" onclick="fazerLogin()">Entrar</button>
        <button onclick="fecharModal('modal-login')" style="background:none; border:none; color:grey; margin-top:15px; cursor:pointer;">Voltar</button>
    </div>
</div>

<!-- Modal Adicionar/Editar -->
<div id="modal-add" class="modal">
    <div class="modal-content">
        <h2 id="modal-titulo" style="color:var(--gold)">GESTÃO DE IMÓVEL</h2>
        <input type="hidden" id="edit-id" value="">
        <input type="text" id="cidade" placeholder="Nome do Empreendimento">
        <input type="number" id="quartos" placeholder="Nº de Suítes">
        <input type="number" id="unidades" placeholder="Vagas de Garagem">
        <div id="status-fotos" style="color: var(--gold); font-size: 0.7rem; margin: 5px 0;"></div>
        <input type="file" id="uploadFotos" accept="image/*" multiple>
        <input type="text" id="linkVideo" placeholder="Link do Vídeo (YouTube, etc)">
        <button class="btn-gold" id="btn-publicar" onclick="salvarImovel()">Confirmar</button>
        <button onclick="fecharModal('modal-add')" style="background:none; border:none; color:grey; margin-top:10px; cursor:pointer;">Cancelar</button>
    </div>
</div>

<!-- Outros modais (escolha e carousel) mantidos iguais -->
<div id="modal-escolha" class="modal">
    <div class="modal-content">
        <h2 style="color:var(--gold)">DETALHES</h2>
        <button class="btn-gold" id="btn-ver-video">Assistir Vídeo</button>
        <button class="btn-gold" id="btn-ver-fotos" style="background:none; border:1px solid var(--gold); color:var(--gold)">Ver Galeria</button>
        <button onclick="fecharModal('modal-escolha')" style="color:grey; background:none; border:none; margin-top:20px; cursor:pointer">Voltar</button>
    </div>
</div>

<div id="modal-carousel" class="modal">
    <div id="carousel-view" style="display:none; flex-direction:column; align-items:center; justify-content:center; width:100%; height:100vh;">
        <img id="carousel-img" src="" style="max-width:90%; max-height:75vh; border:1px solid var(--gold);">
        <div style="margin-top:20px; display:flex; gap:20px;">
            <button class="btn-gold" style="width:100px;" onclick="mudarFoto(-1)">❮</button>
            <button class="btn-gold" style="width:100px;" onclick="mudarFoto(1)">❯</button>
        </div>
        <button onclick="fecharModal('modal-carousel')" style="color:white; margin-top:30px; background:none; border:1px solid #333; padding:10px 20px; cursor:pointer">Fechar Galeria</button>
    </div>
</div>

<script>
    // === CONFIGURAÇÃO SUPABASE ===
    const SUPABASE_URL = 'https://ohjtosiyfwxzkgeewizv.supabase.co';  // Substitua se for diferente
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oanRvc2l5Znd4emtnZWV3aXp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2MjA4MzcsImV4cCI6MjA5MjE5NjgzN30.4d_NcCXDUMq9JdAETvssI8bv5WY3c5F4hzEVnL9XjdY";

    const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let fotosTemp = [];
    let imovelAtual = null;
    let fotoIndice = 0;
    let isAdmin = false;

    // Login ADM
    async function fazerLogin() {
        const email = document.getElementById('emailAdmin').value.trim();
        const senha = document.getElementById('senhaAdmin').value;

        if (!email || !senha) {
            alert("Preencha email e senha!");
            return;
        }

        const { data, error } = await supabase.auth.signInWithPassword({
            email: email,
            password: senha
        });

        if (error) {
            alert("Erro ao fazer login: " + error.message);
        } else {
            isAdmin = true;
            document.getElementById('main-body').classList.add('is-admin');
            fecharModal('modal-login');
            renderizar();
            alert("Login realizado com sucesso!");
        }
        document.getElementById('senhaAdmin').value = '';
    }

    // Comprimir imagem (mantido igual)
    async function comprimirImagem(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const width = 800;
                    const scale = width / img.width;
                    canvas.width = width;
                    canvas.height = img.height * scale;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', 0.8));
                };
            };
        });
    }

    // Upload de fotos
    document.getElementById('uploadFotos').addEventListener('change', async function(e) {
        const btn = document.getElementById('btn-publicar');
        btn.disabled = true;
        btn.innerText = "PROCESSANDO...";
        fotosTemp = [];
        for (let file of e.target.files) {
            fotosTemp.push(await comprimirImagem(file));
        }
        document.getElementById('status-fotos').innerText = fotosTemp.length + " fotos carregadas.";
        btn.disabled = false;
        btn.innerText = "Confirmar";
    });

    // Salvar ou editar imóvel no Supabase
    async function salvarImovel() {
        const id = document.getElementById('edit-id').value;
        const dados = {
            cidade: document.getElementById('cidade').value.trim(),
            quartos: parseInt(document.getElementById('quartos').value) || 0,
            unidades: parseInt(document.getElementById('unidades').value) || 0,
            video: document.getElementById('linkVideo').value.trim(),
            fotos: fotosTemp
        };

        if (!dados.cidade || dados.fotos.length === 0) {
            alert("Preencha o nome do empreendimento e adicione pelo menos uma foto!");
            return;
        }

        let result;
        if (id) {
            // Atualizar
            result = await supabase
                .from('imoveis')
                .update(dados)
                .eq('id', id);
        } else {
            // Inserir novo
            result = await supabase
                .from('imoveis')
                .insert([dados]);
        }

        if (result.error) {
            alert("Erro ao salvar: " + result.error.message);
        } else {
            alert(id ? "Imóvel atualizado!" : "Imóvel adicionado com sucesso!");
            fecharModal('modal-add');
            renderizar();
        }
    }

    // Carregar imóveis do Supabase
    async function carregarImoveis() {
        const { data, error } = await supabase
            .from('imoveis')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            console.error("Erro ao carregar imóveis:", error);
            return [];
        }
        return data || [];
    }

    // Renderizar grid
    async function renderizar() {
        const imoveis = await carregarImoveis();
        const grid = document.getElementById('lista-imoveis');
        grid.innerHTML = imoveis.map((im, i) => `
            <div class="card">
                <div class="admin-controls">
                    <button class="btn-tool" onclick="editarImovel('${im.id}')">✎</button>
                    <button class="btn-tool" onclick="excluirImovel('${im.id}')">🗑</button>
                </div>
                <img src="${im.fotos[0]}" onclick="prepararEscolha('${im.id}')">
                <div class="card-info">
                    <h3>${im.cidade}</h3>
                    <p>${im.quartos} SUÍTES • ${im.unidades} VAGAS</p>
                </div>
            </div>
        `).join('');
    }

    // Editar
    async function editarImovel(id) {
        const { data } = await supabase.from('imoveis').select('*').eq('id', id).single();
        if (!data) return;

        abrirModal('modal-add');
        document.getElementById('edit-id').value = data.id;
        document.getElementById('cidade').value = data.cidade;
        document.getElementById('quartos').value = data.quartos;
        document.getElementById('unidades').value = data.unidades;
        document.getElementById('linkVideo').value = data.video || '';
        fotosTemp = [...(data.fotos || [])];
        document.getElementById('status-fotos').innerText = fotosTemp.length + " fotos mantidas.";
    }

    // Excluir
    async function excluirImovel(id) {
        if (!confirm("Deseja realmente excluir este imóvel?")) return;

        const { error } = await supabase.from('imoveis').delete().eq('id', id);
        if (error) {
            alert("Erro ao excluir: " + error.message);
        } else {
            renderizar();
        }
    }

    function abrirModal(id) {
        if (id === 'modal-add' && !document.getElementById('edit-id').value) {
            limparForm();
        }
        document.getElementById(id).style.display = 'flex';
    }

    function fecharModal(id) {
        document.getElementById(id).style.display = 'none';
        if (id === 'modal-carousel') {
            document.getElementById('carousel-view').style.display = 'none';
        }
    }

    function limparForm() {
        document.getElementById('edit-id').value = '';
        document.getElementById('cidade').value = '';
        document.getElementById('quartos').value = '';
        document.getElementById('unidades').value = '';
        document.getElementById('linkVideo').value = '';
        document.getElementById('uploadFotos').value = '';
        fotosTemp = [];
        document.getElementById('status-fotos').innerText = '';
    }

    // Modais de visualização (mantidos quase iguais)
    let imoveisCache = [];
    async function prepararEscolha(id) {
        const imoveis = await carregarImoveis();
        imovelAtual = imoveis.find(im => im.id === id);
        if (!imovelAtual) return;

        abrirModal('modal-escolha');
        document.getElementById('btn-ver-video').onclick = () => {
            if (imovelAtual.video) window.open(imovelAtual.video, '_blank');
            else alert("Nenhum vídeo cadastrado.");
        };
        document.getElementById('btn-ver-fotos').onclick = () => {
            fecharModal('modal-escolha');
            fotoIndice = 0;
            document.getElementById('carousel-view').style.display = 'flex';
            document.getElementById('carousel-img').src = imovelAtual.fotos[0];
            abrirModal('modal-carousel');
        };
    }

    function mudarFoto(dir) {
        if (!imovelAtual) return;
        fotoIndice = (fotoIndice + dir + imovelAtual.fotos.length) % imovelAtual.fotos.length;
        document.getElementById('carousel-img').src = imovelAtual.fotos[fotoIndice];
    }

    // Inicializar
    window.onload = async () => {
        renderizar();

        // Opcional: verificar se já está logado (sessão persistente)
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
            isAdmin = true;
            document.getElementById('main-body').classList.add('is-admin');
        }
    };
</script>
</body>
</html>
