<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Império Imobiliária | Catálogo Digital Profissional</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:wght@700&display=swap');
        :root { --gold: #c5a059; --black: #000; --dark-gray: #111; --white: #fff; --red: #ff4d4d; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--black); color: var(--white); margin: 0; }
        
        /* Layout Header */
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; border-bottom: 1px solid #222; }
        .admin-only, .btn-logout { display: none; }
        .is-admin .admin-only { display: block; }
        .is-admin .btn-login { display: none; }
        .is-admin .btn-logout { display: block; }

        /* Grid Imóveis */
        #grid-imoveis { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 30px; padding: 50px; }
        .card { background: var(--dark-gray); border: 1px solid #222; position: relative; transition: 0.3s; }
        .card:hover { border-color: var(--gold); }
        .card img { width: 100%; height: 300px; object-fit: cover; cursor: pointer; }
        
        /* Ferramentas do Admin */
        .card-tools { position: absolute; top: 10px; right: 10px; display: none; gap: 5px; }
        .is-admin .card-tools { display: flex; }
        .btn-tool { background: rgba(0,0,0,0.8); border: 1px solid var(--gold); color: white; padding: 8px; cursor: pointer; }
        
        /* Modais */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; justify-content: center; align-items: center; }
        .modal-content { background: #050505; padding: 40px; border: 1px solid var(--gold); width: 90%; max-width: 500px; text-align: center; }
        input { width: 100%; padding: 15px; margin: 10px 0; background: #000; border: 1px solid #333; color: white; box-sizing: border-box; }
        .btn-gold { width: 100%; padding: 15px; background: var(--gold); border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        
        /* Galeria */
        #img-galeria { max-width: 100%; max-height: 60vh; object-fit: contain; }
    </style>
</head>
<body id="main-body">

<header>
    <h2 style="color:var(--gold)">IMPÉRIO IMOBILIÁRIA</h2>
    <div style="display:flex; gap:15px;">
        <button class="admin-only" onclick="abrirModal('modal-add')">ADICIONAR</button>
        <button class="btn-login" onclick="abrirModal('modal-login')">PAINEL ADM</button>
        <button class="btn-logout" style="background:var(--red)" onclick="sairAdmin()">SAIR ADM</button>
    </div>
</header>

<div id="grid-imoveis"></div>

<div id="modal-login" class="modal"><div class="modal-content"><input type="password" id="senha" placeholder="Senha"><button class="btn-gold" onclick="login()">ENTRAR</button></div></div>
<div id="modal-add" class="modal"><div class="modal-content"><input type="text" id="add-cidade" placeholder="Nome"><input type="number" id="add-quartos" placeholder="Suítes"><input type="number" id="add-vagas" placeholder="Vagas"><input type="text" id="add-video" placeholder="Link Vídeo"><input type="file" id="add-fotos" multiple><button class="btn-gold" onclick="salvarImovel()">PUBLICAR</button></div></div>
<div id="modal-escolha" class="modal"><div class="modal-content"><h2>OPÇÕES</h2><button class="btn-gold" onclick="abrirGaleria()">VER FOTOS</button><button class="btn-gold" onclick="abrirVideo()">VER VÍDEO</button></div></div>
<div id="modal-galeria" class="modal"><div class="modal-content"><img id="img-galeria"><div style="display:flex; justify-content:space-between; margin-top:20px;"><button onclick="mudarFoto(-1)">❮</button><button onclick="mudarFoto(1)">❯</button></div></div></div>

<script>
    // 1. CONFIGURAÇÃO SUPABASE
    const SUPABASE_URL = 'https://ohjtosiyfwxzkgeewizv.supabase.co';
    const SUPABASE_KEY = 'SUA_CHAVE_ANON'; eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oanRvc2l5Znd4emtnZWV3aXp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2MjA4MzcsImV4cCI6MjA5MjE5NjgzN30.4d_NcCXDUMq9JdAETvssI8bv5WY3c5F4hzEVnL9XjdY
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let imoveis = [];
    let imovelAtual = null;
    let fotosAtuais = [];
    let indiceFoto = 0;

    // 2. FUNÇÕES DE SUPORTE
    function abrirModal(id) { document.getElementById(id).style.display = 'flex'; }
    function fecharModal(id) { document.getElementById(id).style.display = 'none'; }
    function login() { if(document.getElementById('senha').value === '123') { document.getElementById('main-body').classList.add('is-admin'); fecharModal('modal-login'); } else alert("Senha Incorreta!"); }
    function sairAdmin() { document.getElementById('main-body').classList.remove('is-admin'); }

    // 3. BUSCA DE DADOS (SUPABASE)
    async function carregarImoveis() {
        const { data, error } = await supabase.from('imoveis').select('*');
        if(data) {
            imoveis = data;
            const grid = document.getElementById('grid-imoveis');
            grid.innerHTML = imoveis.map((im, i) => `
                <div class="card" onclick="selecionarImovel(${i})">
                    <div class="card-tools"><button class="btn-tool" onclick="excluirImovel('${im.id}')">🗑</button></div>
                    <img src="${SUPABASE_URL}/storage/v1/object/public/fotos-imoveis/${im.foto_capa}">
                    <div style="padding:15px;"><h3>${im.cidade}</h3><p>${im.quartos} SUÍTES • ${im.unidades} VAGAS</p></div>
                </div>
            `).join('');
        }
    }

    // 4. LÓGICA DE GALERIA
    function selecionarImovel(i) {
        imovelAtual = imoveis[i];
        fotosAtuais = imovelAtual.fotos_lista || [];
        abrirModal('modal-escolha');
    }

    function abrirGaleria() {
        if(fotosAtuais.length === 0) return alert("Sem fotos!");
        fecharModal('modal-escolha');
        indiceFoto = 0;
        document.getElementById('img-galeria').src = `${SUPABASE_URL}/storage/v1/object/public/fotos-imoveis/${fotosAtuais[indiceFoto]}`;
        abrirModal('modal-galeria');
    }

    function mudarFoto(dir) {
        indiceFoto = (indiceFoto + dir + fotosAtuais.length) % fotosAtuais.length;
        document.getElementById('img-galeria').src = `${SUPABASE_URL}/storage/v1/object/public/fotos-imoveis/${fotosAtuais[indiceFoto]}`;
    }

    function abrirVideo() { window.open(imovelAtual.video, '_blank'); }

    // 5. UPLOAD (SIMPLIFICADO)
    async function salvarImovel() {
        const file = document.getElementById('add-fotos').files[0];
        const nomeArquivo = Date.now() + "_" + file.name;
        
        await supabase.storage.from('fotos-imoveis').upload(nomeArquivo, file);
        await supabase.from('imoveis').insert([{
            cidade: document.getElementById('add-cidade').value,
            quartos: document.getElementById('add-quartos').value,
            unidades: document.getElementById('add-vagas').value,
            video: document.getElementById('add-video').value,
            foto_capa: nomeArquivo,
            fotos_lista: [nomeArquivo]
        }]);
        carregarImoveis();
        fecharModal('modal-add');
    }

    async function excluirImovel(id) {
        if(confirm("Excluir?")) {
            await supabase.from('imoveis').delete().eq('id', id);
            carregarImoveis();
        }
    }

    carregarImoveis();
</script>
</body>
</html>
