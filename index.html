<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Império Imobiliária | Sistema</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --gold: #c5a059; --black: #000000; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--black); color: #fff; margin: 0; }
        /* A classe .admin-hidden gerencia o que aparece só quando logado */
        .admin-hidden { display: none; }
        .is-admin .admin-hidden { display: block; }
        .btn-gold { background: var(--gold); border: none; padding: 10px 20px; cursor: pointer; color: #000; font-weight: bold; }
        #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 20px; }
    </style>
</head>
<body id="body">

<header style="padding: 20px; border-bottom: 1px solid #333;">
    <button onclick="fazerLogin()">LOGIN ADM</button>
    <button class="admin-hidden" onclick="document.getElementById('modal-add').style.display='block'">ADICIONAR IMÓVEL</button>
</header>

<div id="grid"></div>

<div id="modal-add" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); padding:50px;">
    <input id="cidade" placeholder="Empreendimento" style="width:100%; padding:10px;">
    <button class="btn-gold" onclick="salvar()">SALVAR NO BANCO</button>
    <button onclick="document.getElementById('modal-add').style.display='none'">FECHAR</button>
</div>

<script>
    const supabase = supabase.createClient('https://ohjtosiyfwxzkgeewizv.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oanRvc2l5Znd4emtnZWV3aXp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2MjA4MzcsImV4cCI6MjA5MjE5NjgzN30.4d_NcCXDUMq9JdAETvssI8bv5WY3c5F4hzEVnL9XjdY');

    function fazerLogin() {
        const senha = prompt("Senha:");
        if(senha === '123') {
            document.getElementById('body').classList.add('is-admin');
        } else {
            alert("Senha incorreta.");
        }
    }

    async function salvar() {
        const nome = document.getElementById('cidade').value;
        const { error } = await supabase.from('imoveis').insert([{ cidade: nome }]);
        if(error) {
            alert("Erro: Verifique se a tabela 'imoveis' existe e tem permissão pública.");
        } else {
            alert("Sucesso!");
            carregar();
        }
    }

    async function carregar() {
        const { data } = await supabase.from('imoveis').select('*');
        const grid = document.getElementById('grid');
        grid.innerHTML = data.map(item => `
            <div style="border:1px solid #444; padding:20px;">
                <h3>${item.cidade}</h3>
                <button class="admin-hidden" onclick="deletar(${item.id})">EXCLUIR</button>
            </div>
        `).join('');
    }

    async function deletar(id) {
        await supabase.from('imoveis').delete().eq('id', id);
        carregar();
    }

    carregar();
</script>
</body>
</html>
