<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Império Imobiliária | Catálogo Digital</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:wght@700&display=swap');
        :root { --gold: #c5a059; --black: #000000; --dark-gray: #0a0a0a; --white: #ffffff; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--black); color: var(--white); margin: 0; padding: 0; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; background: var(--black); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .header-right { display: flex; align-items: center; gap: 25px; }
        
        /* Controle de visibilidade do Admin */
        #btn-add-imovel { display: none; }
        .is-admin #btn-add-imovel { display: block; }
        
        #lista-imoveis { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 25px; max-width: 1200px; margin: 50px auto; padding: 0 20px; }
        
        .card { background: var(--dark-gray); border: 1px solid #1a1a1a; position: relative; }
        .card img { width: 100%; height: 400px; object-fit: cover; cursor: pointer; }
        
        /* Ícones de Admin no Card */
        .admin-tools { display: none; position: absolute; top: 15px; left: 15px; z-index: 10; gap: 10px; }
        .is-admin .admin-tools { display: flex; }
        .btn-tool { background: rgba(0,0,0,0.7); border: 1px solid var(--gold); color: white; padding: 8px; cursor: pointer; border-radius: 4px; }
        .btn-del { position: absolute; top: 15px; right: 15px; z-index: 10; background: rgba(0,0,0,0.7); border: 1px solid red; color: white; padding: 8px; cursor: pointer; border-radius: 4px; display: none; }
        .is-admin .btn-del { display: block; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: #0d0d0d; padding: 40px; border: 1px solid var(--gold); width: 90%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 15px; margin: 10px 0; background: #000; border: 1px solid #333; color: white; box-sizing: border-box; }
        .btn-gold { width: 100%; padding: 15px; background: var(--gold); border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
    </style>
</head>
<body id="main-body">

<header>
    <img src="logo.png" style="height:65px">
    <div class="header-right">
        <button id="btn-add-imovel" class="btn-header" onclick="abrirModal('modal-add')">Adicionar Imóvel</button>
        <button class="btn-header" onclick="abrirModal('modal-login')">Painel ADM</button>
    </div>
</header>

<div id="lista-imoveis"></div>

<div id="modal-login" class="modal"><div class="modal-content"><input type="password" id="senhaAdmin" placeholder="Senha"><button class="btn-gold" onclick="verificarSenha()">Entrar</button></div></div>

<div id="modal-add" class="modal">
    <div class="modal-content">
        <h2>GESTÃO DE IMÓVEL</h2>
        <input type="hidden" id="edit-index" value="-1">
        <input type="text" id="cidade" placeholder="Nome do Empreendimento">
        <input type="number" id="quartos" placeholder="Suítes">
        <input type="number" id="unidades" placeholder="Vagas">
        <input type="file" id="uploadFotos" accept="image/*" multiple>
        <input type="text" id="linkVideo" placeholder="Link do Vídeo">
        <button class="btn-gold" onclick="salvarImovel()">Confirmar</button>
    </div>
</div>

<script>
    let imoveis = JSON.parse(localStorage.getItem('luxuryImoveis')) || [];
    let fotosTemp = [];

    function verificarSenha() {
        if(document.getElementById('senhaAdmin').value === '123') {
            document.getElementById('main-body').classList.add('is-admin');
            fecharModal('modal-login');
            renderizar();
        } else { alert("Senha Incorreta!"); }
    }

    // Lógica de salvar com compressão mantida
    async function salvarImovel() {
        const index = parseInt(document.getElementById('edit-index').value);
        const dados = {
            cidade: document.getElementById('cidade').value,
            quartos: document.getElementById('quartos').value,
            unidades: document.getElementById('unidades').value,
            video: document.getElementById('linkVideo').value,
            fotos: fotosTemp
        };
        
        if(index !== -1) imoveis[index] = dados;
        else imoveis.push(dados);
        
        localStorage.setItem('luxuryImoveis', JSON.stringify(imoveis));
        renderizar();
        fecharModal('modal-add');
    }

    function renderizar() {
        const grid = document.getElementById('lista-imoveis');
        grid.innerHTML = imoveis.map((im, i) => `
            <div class="card">
                <div class="admin-tools">
                    <button class="btn-tool" onclick="editarImovel(${i})">✎</button>
                </div>
                <button class="btn-del" onclick="excluirImovel(${i})">🗑</button>
                <img src="${im.fotos[0]}" onclick="alert('Opções: Ver Fotos ou Ver Vídeo')">
                <div class="card-info">
                    <h3>${im.cidade}</h3>
                    <p>${im.quartos} SUÍTES • ${im.unidades} VAGAS</p>
                </div>
            </div>
        `).join('');
    }

    function editarImovel(index) {
        const im = imoveis[index];
        document.getElementById('edit-index').value = index;
        document.getElementById('cidade').value = im.cidade;
        abrirModal('modal-add');
    }

    function excluirImovel(index) {
        if(confirm("Excluir?")) {
            imoveis.splice(index, 1);
            localStorage.setItem('luxuryImoveis', JSON.stringify(imoveis));
            renderizar();
        }
    }

    function abrirModal(id) { document.getElementById(id).style.display = 'flex'; }
    function fecharModal(id) { document.getElementById(id).style.display = 'none'; }
    
    renderizar();
</script>
</body>
</html>
