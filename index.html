<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Império Imobiliária | Catálogo Digital</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:wght@700&display=swap');
        :root { --gold: #c5a059; --black: #000000; --dark-gray: #0a0a0a; --white: #ffffff; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--black); color: var(--white); margin: 0; padding: 0; overflow-x: hidden; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; background: var(--black); border-bottom: 1px solid rgba(255,255,255,0.05); position: sticky; top: 0; z-index: 1000; }
        .header-logo { height: 65px; }
        .header-right { display: flex; align-items: center; gap: 25px; }
        .btn-header { color: var(--white); text-decoration: none; font-size: 11px; letter-spacing: 2px; font-weight: bold; background: none; border: none; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        .btn-header:hover { color: var(--gold); }
        .insta-icon { height: 24px; filter: invert(1); opacity: 0.8; transition: 0.3s; }
        .hero { text-align: center; padding: 50px 20px; background: var(--black); }
        .hero-logo-grande { max-width: 450px; margin-bottom: 10px; }
        .hero h1 { font-family: 'Playfair Display', serif; font-size: 3.8rem; color: var(--gold); margin: 0; font-weight: 700; }
        .hero p { letter-spacing: 5px; font-size: 14px; text-transform: uppercase; font-weight: 300; margin-top: 10px; }
        .gold-line { width: 120px; height: 1px; background: var(--gold); margin: 30px auto; }
        #lista-imoveis { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto 80px; padding: 0 20px; }
        .card { background: var(--dark-gray); border: 1px solid #1a1a1a; position: relative; overflow: hidden; }
        .card img { width: 100%; height: 400px; object-fit: cover; cursor: pointer; }
        .card-info { position: absolute; bottom: 0; width: 100%; background: linear-gradient(transparent, rgba(0,0,0,0.95)); padding: 20px; box-sizing: border-box; }
        .card-info h3 { color: var(--gold); margin: 0; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; }
        .card-info p { margin: 5px 0 0; font-size: 0.8rem; color: #bbb; letter-spacing: 1px; }
        .admin-controls { display: none; position: absolute; top: 15px; width: 100%; padding: 0 15px; box-sizing: border-box; z-index: 10; }
        .is-admin .admin-controls { display: flex; justify-content: space-between; }
        .btn-tool { width: 35px; height: 35px; border-radius: 50%; border: none; cursor: pointer; background: rgba(0,0,0,0.8); color: white; border: 1px solid var(--gold); }
        footer { text-align: center; padding: 80px 20px; border-top: 1px solid rgba(197, 160, 89, 0.2); background: var(--black); }
        .footer-logo { height: 50px; margin-bottom: 20px; }
        .footer-name { font-family: 'Playfair Display', serif; font-size: 2.5rem; color: var(--gold); margin: 0; letter-spacing: 3px; text-transform: uppercase; }
        .footer-info { margin-top: 20px; font-size: 11px; letter-spacing: 4px; color: #777; text-transform: uppercase; line-height: 2; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: #0d0d0d; padding: 40px; border: 1px solid var(--gold); width: 90%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 15px; margin: 10px 0; background: #000; border: 1px solid #333; color: white; box-sizing: border-box; }
        .btn-gold { width: 100%; padding: 15px; background: var(--gold); border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
    </style>
</head>
<body id="main-body">

<header>
    <img src="logo.png" class="header-logo" alt="Império">
    <div class="header-right">
        <button class="btn-header" onclick="abrirModal('modal-add')">Adicionar Imóvel</button>
        <button class="btn-header" onclick="abrirModal('modal-login')">Painel ADM</button>
        <a href="https://www.instagram.com/imperio_imobiliaria1/" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" class="insta-icon"></a>
    </div>
</header>

<section class="hero">
    <img src="logo.png" class="hero-logo-grande" alt="Império Imobiliária">
    <h1>Catálogo Digital</h1>
    <p>Império Imobiliária | Acredite e Realize!</p>
    <div class="gold-line"></div>
</section>

<div id="lista-imoveis"></div>

<footer>
    <img src="logo.png" class="footer-logo">
    <h2 class="footer-name">Império</h2>
    <div class="footer-info">EXCELÊNCIA EM NEGÓCIOS IMOBILIÁRIOS | CRECI 20199-J | PERNAMBUCO</div>
</footer>

<div id="modal-login" class="modal">
    <div class="modal-content">
        <h2 style="color:var(--gold)">ACESSO</h2>
        <input type="password" id="senhaAdmin" placeholder="Senha">
        <button class="btn-gold" onclick="verificarSenha()">Entrar</button>
    </div>
</div>

<div id="modal-add" class="modal">
    <div class="modal-content">
        <h2 style="color:var(--gold)">NOVO IMÓVEL</h2>
        <input type="text" id="cidade" placeholder="Empreendimento">
        <input type="number" id="quartos" placeholder="Suítes">
        <input type="number" id="unidades" placeholder="Vagas">
        <input type="text" id="linkVideo" placeholder="Link Vídeo">
        <button class="btn-gold" onclick="salvarImovel()">Confirmar</button>
    </div>
</div>

<script>
    // Inicialização corrigida
    const supabaseClient = supabase.createClient('https://ohjtosiyfwxzkgeewizv.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oanRvc2l5Znd4emtnZWV3aXp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2MjA4MzcsImV4cCI6MjA5MjE5NjgzN30.4d_NcCXDUMq9JdAETvssI8bv5WY3c5F4hzEVnL9XjdY');

    async function carregarImoveis() {
        const { data, error } = await supabaseClient.from('imoveis').select('*');
        if (error) { console.error("Erro ao carregar:", error); return; }
        
        const grid = document.getElementById('lista-imoveis');
        grid.innerHTML = (data || []).map((im) => `
            <div class="card">
                <div class="admin-controls"><button class="btn-tool" onclick="excluirImovel(${im.id})">🗑</button></div>
                <img src="https://via.placeholder.com/400" onclick="alert('Funcionalidade de fotos em breve!')">
                <div class="card-info">
                    <h3>${im.cidade}</h3>
                    <p>${im.quartos} SUÍTES • ${im.unidades} VAGAS</p>
                </div>
            </div>
        `).join('');
    }

    async function salvarImovel() {
        const dados = { 
            cidade: document.getElementById('cidade').value, 
            quartos: parseInt(document.getElementById('quartos').value), 
            unidades: parseInt(document.getElementById('unidades').value), 
            video: document.getElementById('linkVideo').value 
        };
        const { error } = await supabaseClient.from('imoveis').insert([dados]);
        if (error) { alert("Erro: " + error.message); } else { carregarImoveis(); fecharModal('modal-add'); }
    }

    async function excluirImovel(id) {
        if(confirm("Deseja excluir?")) {
            await supabaseClient.from('imoveis').delete().eq('id', id);
            carregarImoveis();
        }
    }

    function verificarSenha() {
        if(document.getElementById('senhaAdmin').value === '123') {
            document.getElementById('main-body').classList.add('is-admin');
            fecharModal('modal-login');
        } else { alert("Senha Incorreta!"); }
    }

    function abrirModal(id) { document.getElementById(id).style.display = 'flex'; }
    function fecharModal(id) { document.getElementById(id).style.display = 'none'; }

    carregarImoveis();
</script>
</body>
</html>
